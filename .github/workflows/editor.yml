name: editor

on:
  push:
    branches: [main]
    paths:
      - 'scratch-gui/**'
      - '.github/workflows/editor.yml'
  pull_request:
    paths:
      - 'scratch-gui/**'
      - '.github/workflows/editor.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22.13'
          cache: npm
          cache-dependency-path: scratch-gui/package-lock.json

      - run: npm ci
        working-directory: scratch-gui
        timeout-minutes: 20

      - name: Lint the collab client, world seams and kits
        run: npx eslint --no-error-on-unmatched-pattern src/lib/collab src/lib/world src/lib/kits src/lib/together2 --ext .js,.jsx
        working-directory: scratch-gui

      - name: Together extension
        run: node src/lib/libraries/extensions/together/together.test.mjs
        working-directory: scratch-gui

      - name: Collab client
        run: for t in src/lib/collab/*.test.mjs; do node "$t" || exit 1; done
        working-directory: scratch-gui

      - name: World seams, kits and Together 2
        run: for t in src/lib/world/*.test.mjs src/lib/kits/*.test.mjs src/lib/together2/*.test.mjs; do [ -e "$t" ] || continue; node "$t" || exit 1; done
        working-directory: scratch-gui

      - name: Build
        run: npm run build
        working-directory: scratch-gui
        timeout-minutes: 30
        env:
          NODE_OPTIONS: --openssl-legacy-provider --max-old-space-size=4096
          NODE_ENV: production

      - name: Bundle size
        run: node size-check.mjs
        working-directory: scratch-gui
        env:
          NODE_ENV: production
