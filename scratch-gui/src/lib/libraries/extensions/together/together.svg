<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="192" height="120" viewBox="0 0 192 120" role="img" aria-label="Together">
  <defs>
    <linearGradient id="sq-tg-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b1f63"/>
      <stop offset="1" stop-color="#150e30"/>
    </linearGradient>
    <radialGradient id="sq-tg-halo" cx="0.5" cy="0.4" r="0.55">
      <stop offset="0" stop-color="#7c6cf0" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#7c6cf0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sq-tg-arc" gradientUnits="userSpaceOnUse" x1="56" y1="0" x2="136" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="sq-tg-grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="1" fill="#ffffff" fill-opacity="0.12"/>
    </pattern>
    <filter id="sq-tg-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <g id="sq-tg-pad">
      <circle cx="-17" cy="10" r="11"/>
      <circle cx="17" cy="10" r="11"/>
      <rect x="-28" y="-14" width="56" height="28" rx="12"/>
    </g>
  </defs>
  <rect width="192" height="120" rx="12" fill="url(#sq-tg-bg)"/>
  <rect width="192" height="120" rx="12" fill="url(#sq-tg-grid)"/>
  <ellipse cx="96" cy="48" rx="72" ry="40" fill="url(#sq-tg-halo)"/>
  <g transform="translate(58 80) rotate(-14)">
    <use xlink:href="#sq-tg-pad" href="#sq-tg-pad" fill="#f6f2ff"/>
    <rect x="-20" y="-6" width="4" height="12" rx="1.2" fill="#2b1f63"/>
    <rect x="-24" y="-2" width="12" height="4" rx="1.2" fill="#2b1f63"/>
    <circle cx="18" cy="-5" r="2.4" fill="#22d3ee"/>
    <circle cx="13" cy="0" r="2.4" fill="#2b1f63"/>
    <circle cx="23" cy="0" r="2.4" fill="#2b1f63"/>
    <circle cx="18" cy="5" r="2.4" fill="#22d3ee"/>
  </g>
  <g transform="translate(134 80) rotate(14)">
    <use xlink:href="#sq-tg-pad" href="#sq-tg-pad" fill="#f6f2ff"/>
    <rect x="-20" y="-6" width="4" height="12" rx="1.2" fill="#2b1f63"/>
    <rect x="-24" y="-2" width="12" height="4" rx="1.2" fill="#2b1f63"/>
    <circle cx="18" cy="-5" r="2.4" fill="#a78bfa"/>
    <circle cx="13" cy="0" r="2.4" fill="#2b1f63"/>
    <circle cx="23" cy="0" r="2.4" fill="#2b1f63"/>
    <circle cx="18" cy="5" r="2.4" fill="#a78bfa"/>
  </g>
  <path d="M56 60 Q96 -12 136 60" fill="none" stroke="url(#sq-tg-arc)" stroke-width="4" stroke-linecap="round" filter="url(#sq-tg-glow)"/>
  <circle cx="76" cy="33" r="2" fill="#bdf6ff"/>
  <circle cx="96" cy="24" r="3.5" fill="#ffffff" filter="url(#sq-tg-glow)"/>
  <circle cx="116" cy="33" r="2" fill="#dcd0ff"/>
</svg>
